name: Gates

# Runs the same checks a human runs before pushing, so a red tree cannot land on
# `main` unnoticed. The Pages workflow only ships `docs/`, this one guards the app.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 22 is the floor, not a preference: the verify scripts import `.ts` modules
      # directly and rely on Node's type stripping, which only runs unflagged from
      # 22.18. Node 20 fails with ERR_UNKNOWN_FILE_EXTENSION.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run typecheck` is both projects: `tsc --noEmit` for the browser app
      # and `tsc -p tsconfig.node.json` for the dev plugin, the Vite config and
      # the verify scripts. Plain `tsc --noEmit` would silently skip the Node side.
      - name: Typecheck
        run: npm run typecheck

      - name: Verify scripts
        run: npm run verify

      - name: Build bundle
        run: npx vite build --outDir "$RUNNER_TEMP/gates-dist" --emptyOutDir
