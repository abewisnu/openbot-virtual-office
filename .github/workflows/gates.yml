name: Gates

# Runs the same checks a human runs before pushing, so a red tree cannot land on
# `main` unnoticed. The Pages workflow only ships `docs/`, this one guards the app.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Verify scripts
        run: npm run verify

      - name: Build bundle
        run: npx vite build --outDir "$RUNNER_TEMP/gates-dist" --emptyOutDir
